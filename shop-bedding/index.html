<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>کالای خواب هاشمزاده — قالب‌ها</title>
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <style>
    body {
      font-family: "Vazirmatn", Tahoma, sans-serif;
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #faf8f2, #f2e2f3 50%, #ffe8ef);
      color: #242424; padding: 24px;
    }
    .box {
      background: #fff; border-radius: 16px; padding: 32px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08); max-width: 480px; width: 100%;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #777; margin: 0 0 24px; font-size: 14px; }
    .links { display: flex; flex-direction: column; gap: 10px; }
    a {
      display: block; padding: 14px 18px; border-radius: 10px;
      font-weight: 800; text-decoration: none; transition: .2s; color: #fff;
    }
    a.sargol { background: #7a2a82; }
    a.wood { background: #d60644; }
    a.majora { background: #222; }
    a:hover { filter: brightness(1.1); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="box">
    <h1>کالای خواب هاشمزاده</h1>
    <p>یکی از قالب‌ها را انتخاب کنید</p>
    <div class="links">
      <a class="sargol" href="sargol/">قالب ۱ — سرگل</a>
      <a class="wood" href="wood/">قالب ۲ — وود</a>
      <a class="majora" href="majora/">قالب ۳ — ماژورا</a>
    </div>
  </div>
</body>
</html>
